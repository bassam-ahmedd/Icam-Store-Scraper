name: icamstore daily scrape

on:
  schedule:
    # Twice daily. GitHub often delays scheduled runs by hours, so we no longer
    # gate on an exact Cairo hour — every scheduled run scrapes. These two UTC
    # times land around morning/evening Cairo; delays just shift them a bit.
    - cron: "0 3 * * *"
    - cron: "0 15 * * *"
  workflow_dispatch: {}   # lets you trigger a manual run from the Actions tab

concurrency:
  group: icamstore-scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run scraper
        env:
          ZENROWS_API_KEY:   ${{ secrets.ZENROWS_API_KEY }}
          SHEET_ID:          ${{ secrets.SPREADSHEET_ID }}
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          PROXY_COUNTRY:     ae
        run: python icamstore_scraper.py
